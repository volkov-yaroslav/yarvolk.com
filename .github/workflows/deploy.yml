name: Deploy to CloudPanel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      SITE_SRC_DIR: /home/yarvolk-com/site-src
      SITE_DEST_DIR: /home/yarvolk-com/htdocs/yarvolk.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check i18n sync
        run: npm run check:i18n

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preflight checks
        run: |
          set -euxo pipefail
          command -v node
          command -v npm
          command -v rsync
          command -v git
          test -d dist
          test -d "$SITE_DEST_DIR"

      - name: Update server source backup
        run: |
          set -euxo pipefail
          mkdir -p "$SITE_SRC_DIR"
          rsync -az --delete \
            --exclude ".git/" \
            --exclude "node_modules/" \
            "$GITHUB_WORKSPACE/" "$SITE_SRC_DIR/"

      - name: Deploy
        run: |
          set -euxo pipefail
          rm -f dist/.gitignore
          rsync -az --delete dist/ "$SITE_DEST_DIR/"
